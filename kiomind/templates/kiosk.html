<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AI 키오스크</title>
  <meta name="viewport" content="width=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      width: 100vw; height: 100vh; margin: 0; padding: 0;
      background: #fff4f4;
      overflow: hidden;
    }
    body {
      width: 1080px; height: 1920px;
      margin: 0 auto; 
      font-family: 'Arial', sans-serif;
      font-size: 24px;
      display: flex; flex-direction: column;
    }
    header {
      background: #ff6f61;
      color: white;
      text-align: center;
      padding: 36px 0 28px 0;
      font-size: 48px;
      letter-spacing: 2px;
    }
    .screen {
      display: none;
      flex: 1 1 0;
      height: calc(100% - 112px); 
      flex-direction: column;
    }
    .active { display: flex; }

    .tabs {
      display: flex; justify-content: space-around;
      background: #fff; border-bottom: 4px solid #ddd;
    }
    .tab {
      flex: 1; padding: 32px 0; font-size: 32px;
      text-align: center; cursor: pointer; background: #eee;
      border: none; outline: none;
    }
    .tab.active { background: #ff6f61; color: white; }

    .container {
      display: flex; flex: 1 1 0; height: 0;
      min-height: 0; 
    }
    .menu-area {
      flex: 3;
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 36px;
      padding: 36px;
      overflow-y: auto;
      height: 100%;
      max-height: 1120px;
    }
    .menu-item {
      background: white;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; align-items: center;
    }
    .menu-item img {
      width: 100%; max-height: 260px; object-fit: cover; border-radius: 16px;
      margin-bottom: 18px;
    }
    .menu-item h3 {
      font-size: 32px; margin: 8px 0 6px 0;
    }
    .menu-item p {
      font-size: 28px; margin: 0 0 16px 0;
    }
    .menu-item button {
      font-size: 28px; padding: 22px 0; margin: 0;
      background: #2ecc71; color: #fff; border-radius: 12px;
      width: 100%; border: none; cursor: pointer;
    }

    .sidebar {
      flex: 1;
      background: #fff;
      padding: 32px 24px;
      border-left: 4px solid #ccc;
      display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch;
      min-width: 340px; max-width: 440px;
    }
    .sidebar h3 {
      font-size: 34px; margin: 0 0 18px 0;
    }
    .order-list { flex-grow: 1; overflow-y: auto; min-height: 140px; }
    .order-item {
      display: flex; justify-content: space-between; align-items: center; margin: 18px 0;
      font-size: 28px;
    }
    .order-controls button {
      font-size: 24px; margin-left: 8px; padding: 8px 18px;
      border-radius: 8px;
    }
    .total-price {
      font-weight: bold; font-size: 32px; margin: 20px 0 0 0; text-align: right;
    }

    .footer {
      width: 100%; text-align: center; padding: 36px 0 24px 0;
      display: flex; justify-content: center; gap: 32px;
      background: #fff4f4;
    }
    .footer button {
      flex: 1; margin: 0 16px;
      font-size: 36px; padding: 32px 0;
      border-radius: 16px;
      min-width: 0;
    }
    .pay-btn { background: #2c3e50; color: white; }
    .home-btn { background: #aaa; color: white; }
    .btn-voice { background: #27ae60; color: white; }

    .voice-area {
      text-align: center;
      margin: 10px 0 0 0;
      font-size: 26px;
      color: #27ae60;
      min-height: 36px;
    }
  </style>
</head>
<body>
  <header>🎤 AI 키오스크</header>

  
  <div class="screen active" id="start-screen" style="flex-direction: column; justify-content: center; align-items: center;">
    <button class="btn-start" style="font-size:48px; padding:48px 0; margin:40px 0; width:60%;" onclick="startApp()">시작하기</button>
  </div>

  
  <div class="screen" id="type-screen" style="flex-direction: column; justify-content: center; align-items: center;">
    <h2 style="font-size:44px; margin:60px 0 40px 0;">매장 또는 포장을 선택해주세요</h2>
    <button class="btn-dine" style="font-size:40px; padding:40px 0; width:60%;" onclick="startOrder('매장')">🍽️ 매장 식사</button>
    <button class="btn-take" style="font-size:40px; padding:40px 0; width:60%;" onclick="startOrder('포장')">📦 포장</button>
  </div>

  <div class="screen" id="menu-screen" style="flex-direction: column;">
    <div class="tabs">
      <button class="tab active" onclick="filterCategory('전체', event)">전체</button>
      <button class="tab" onclick="filterCategory('커피', event)">커피</button>
      <button class="tab" onclick="filterCategory('음료', event)">음료</button>
      <button class="tab" onclick="filterCategory('디저트', event)">디저트</button>
    </div>
    <div class="container">
      <div class="menu-area" id="menu-area"></div>
      <div class="sidebar">
        <div>
          <h3>🧾 주문 내역</h3>
          <div class="order-list" id="order-list"></div>
          <div class="total-price" id="total-price">총액: 0원</div>
        </div>
      </div>
    </div>
    <div class="footer">
      <button class="pay-btn" onclick="checkout()">✅ 결제하기</button>
      <button class="home-btn" onclick="softReset()">🏠 처음으로</button>
      <button class="btn-voice" onclick="startVoiceRecognition()">🎤 음성 주문 시작</button>
    </div>
      <div id="status-message" style="margin-top: 10px; font-weight: bold; color: #0066cc;"></div>
    <div style="text-align:center;">
      <span id="voice-result" class="voice-area"></span>
    </div>
  </div>

  
  <div class="screen" id="pay-screen" style="flex-direction: column; justify-content: center; align-items: center;">
    <h2 id="pay-msg" style="font-size:44px; margin:80px 0 40px 0;">결제 완료되었습니다.</h2>
    <button style="font-size:38px; padding:36px 0; width:60%;" onclick="softReset()">🔁 처음으로 돌아가기</button>
  </div>

  <script>
    const menu = [
      { idx: 0, name: "아메리카노", price: 1500, category: "커피", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/4b7e4b6a2e3e2.png" },
      { idx: 1, name: "카푸치노", price: 2900, category: "커피", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/1d0f3e0b1b2c3.png" },
      { idx: 2, name: "카페모카", price: 3000, category: "커피", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/0b9b7b5a7e7e5.png" },
      { idx: 3, name: "카라멜마끼아또", price: 3700, category: "커피", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/7e7b7b5a7e7e5.png" },
      { idx: 4, name: "카페라떼", price: 2900, category: "커피", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/6e7b7b5a7e7e5.png" },
      { idx: 5, name: "바닐라라떼", price: 3400, category: "커피", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/5e7b7b5a7e7e5.png" },
      { idx: 6, name: "연유라떼", price: 3900, category: "커피", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/4e7b7b5a7e7e5.png" },
      { idx: 7, name: "복숭아아이스티", price: 3000, category: "음료", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/3e7b7b5a7e7e5.png" },
      { idx: 8, name: "레몬아이스티", price: 3000, category: "음료", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/2e7b7b5a7e7e5.png" },
      { idx: 9, name: "녹차", price: 2500, category: "음료", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/1e7b7b5a7e7e5.png" },
      { idx: 10, name: "캐모마일", price: 2500, category: "음료", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/0e7b7b5a7e7e5.png" },
      { idx: 11, name: "티라미수", price: 6500, category: "디저트", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/4c7e4b6a2e3e2.png" },
      { idx: 12, name: "초코케이크", price: 6300, category: "디저트", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/3c7e4b6a2e3e2.png" },
      { idx: 13, name: "치즈케이크", price: 6300, category: "디저트", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/2c7e4b6a2e3e2.png" },
      { idx: 14, name: "허니브레드", price: 7000, category: "디저트", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/1c7e4b6a2e3e2.png" },
      { idx: 15, name: "소금빵", price: 3500, category: "디저트", img: "https://cdn.imweb.me/upload/S20211216561d1c5e8e7e6/0c7e4b6a2e3e2.png" }
    ];

    let order = {};
    let recognition = null;
    let resetTimer = null;
    let currentAudio = null;
    let speakRequestId = 0; 
    let backToTypeTimer = null;
    let mediaRecorder;
    let chunks = [];
    let lastScreen = null;
    let lastDisplay = null;
    
    function parseQuantity(text) {
      const numMatch = text.match(/(\d+)\s*(잔|개)?/);
      if (numMatch) return parseInt(numMatch[1]);
      const korQtyList = [
        { re: /(한|일)\s*(잔|개)/, val: 1 },
        { re: /두\s*(잔|개)/, val: 2 },
        { re: /세\s*(잔|개)/, val: 3 },
        { re: /네\s*(잔|개)/, val: 4 },
        { re: /(다섯|오)\s*(잔|개)/, val: 5 }
      ];
      for (let q of korQtyList) {
        if (q.re.test(text)) return q.val;
      }
      if (text.includes("하나")) return 1;
      if (text.includes("둘")) return 2;
      if (text.includes("셋")) return 3;
      if (text.includes("넷")) return 4;
      if (text.includes("다섯")) return 5;
      return 1;
    }

    function parseOrders(text) {
      let parts = text.split(/,|그리고|&| 그리고 /g).map(s => s.trim()).filter(Boolean);
      const sortedMenu = [...menu].sort((a, b) => b.name.length - a.name.length).reverse();
      let orders = [];
      for (let part of parts) {
        let menuIdx = null;
        const partNoSpace = part.replace(/\s/g, '');
        for (let item of sortedMenu) {
          if (partNoSpace.includes(item.name)) {
            menuIdx = item.idx;
            break;
          }
        }
        let qty = parseQuantity(part);
        if (menuIdx !== null && qty > 0) {
          orders.push({ menuIdx, qty });
        }
      }
      return orders;
    }

    function speak(text) {
      const thisRequestId = ++speakRequestId;
      
      if(currentAudio){
        currentAudio.pause();
        currentAudio.src = "";
        currentAudio = null;
      }
      
	    fetch('/tts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text})
      })
      .then(response => {
        if (!response.ok) throw new Error("TTS 서버 오류");
        if (thisRequestId !== speakRequestId) {
          console.log("이전 요청 무시됨:", text);
          return;
        }
      setTimeout(() => {
          const audio = new Audio('/voice');
          currentAudio = audio;

          audio.play().then(() => {
            console.log("재생 시작:", text);
          }).catch(err => {
            console.error("재생 실패:", err);
          });
        }, 300);  // 생성 지연을 고려해 약간 대기
      })
      .catch(err => {
        console.error("TTS 요청 실패:", err);
      });
    }
    
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      if (id === "type-screen") {
        speak("매장 또는 포장을 선택해주세요.");
      } else if (id === "menu-screen") {
        speak("메뉴를 선택하거나, 음성 주문 시작 버튼을 눌러 말씀해 주세요.");
      } else if (id === "pay-screen") {
        speak("결제가 완료되었습니다. 감사합니다.");
        
      }
    }

    function startApp() {
      showScreen("type-screen");
    }

    function startOrder(type) {
      renderMenu();
      showScreen("menu-screen");
    }

    function renderMenu(filtered) {
      const area = document.getElementById("menu-area");
      area.innerHTML = "";
      (filtered || menu).forEach(item => {
        const div = document.createElement("div");
        div.className = "menu-item";
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}" />
          <h3>${item.name}</h3>
          <p>${item.price.toLocaleString()}원</p>
          <button onclick="addToOrder('${item.idx}', 1)">추가</button>
        `;
        area.appendChild(div);
      });
      renderOrder();
    }

    function addToOrder(idx, qty) {
      const item = menu.find(m => m.idx == idx);
      if (!order[idx]) order[idx] = { ...item, qty: 0 };
      order[idx].qty += qty;
      if (order[idx].qty <= 0) delete order[idx];
      renderOrder();
    }

    function renderOrder() {
      const container = document.getElementById("order-list");
      const totalEl = document.getElementById("total-price");
      container.innerHTML = "";
      let total = 0;
      Object.values(order).forEach(item => {
        total += item.price * item.qty;
        const div = document.createElement("div");
        div.className = "order-item";
        div.innerHTML = `
          ${item.name} x ${item.qty}
          <span class="order-controls">
            <button onclick="addToOrder('${item.idx}', -1)">-</button>
            <button onclick="addToOrder('${item.idx}', 1)">+</button>
          </span>
        `;
        container.appendChild(div);
      });
      totalEl.textContent = `총액: ${total.toLocaleString()}원`;
    }

    function filterCategory(category, event) {
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      if (event) event.target.classList.add("active");
      if (category === "전체") renderMenu();
      else renderMenu(menu.filter(m => m.category === category));
    }

    function checkout() {
      const orderArr = Object.values(order).map(item => `${item.idx} ${item.qty}`);
      orderArr.forEach(str => {
        fetch('/order', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({order: str})
        });
      });
      
      showScreen("pay-screen");

      if (backToTypeTimer) clearTimeout(backToTypeTimer);

      backToTypeTimer = setTimeout(() => {
        showScreen("start-screen");
        },5000);
        
      document.getElementById("pay-msg").textContent = "결제 완료되었습니다. 감사합니다.";
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(() => softReset(), 15000);
    }

    function softReset() {
      if (resetTimer) {
        clearTimeout(resetTimer);
        resetTimer = null;
      }
      if (recognition) {
        recognition.stop();
        recognition = null;
      }
      order = {};
      renderOrder();
      showScreen("start-screen");
      document.getElementById("voice-result").textContent = "";
    }

   function startVoiceRecognition() {
      const resultEl = document.getElementById("voice-result");
      const statusEl = document.getElementById("status-message");  // 상태 표시용

      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        const mediaRecorder = new MediaRecorder(stream);
        const chunks = [];

        statusEl.textContent = "🎙️ 음성을 듣고 있어요...";

        mediaRecorder.ondataavailable = (e) => {
          chunks.push(e.data);
          console.log("녹음된 blob 크기:", e.data.size);
        };

        mediaRecorder.onerror = (e) => {
          console.error("녹음 에러:", e.error);
        };
        mediaRecorder.onstop = () => {
          statusEl.textContent = "⏳ 서버로 전송 중...";

          const blob = new Blob(chunks, { type: 'audio/webm' });
          console.log("최종 blob 크기:", blob.size);
          const formData = new FormData();
          formData.append("audio", blob, "voice.webm");

          fetch("/recognize", {
            method: "POST",
            body: formData
          })
          .then(res => res.json())
          .then(data => {
            console.log("🎤 /recognize 응답:", data);
            statusEl.textContent = "🤖 ChatGPT가 이해하는 중...";
            if (!data.text) {
              console.error("서버 오류:", data.error || "알 수 없는 오류");
              statusEl.textContent = "❌ 음성 인식에 실패했습니다.";
              return;
            }
            const fullText = data.text;
            resultEl.textContent = `인식 결과: ${fullText}`;
          
          fetch("/ai-order", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: fullText })
            })
            .then(res => res.json())
            
            .then(order => {
              order.forEach(item => {
                const menuItem = menu.find(m => m.name === item.name);
                if (menuItem) {
                  addToOrder(menuItem.idx, item.quantity);
                }
            });
              statusEl.textContent = "✅ 주문이 처리되었습니다.";
            })
            .catch(() => statusEl.textContent = "⚠️ 주문 처리에 실패했습니다.");
          })
          .catch(() => statusEl.textContent = "❌ 음성 인식에 실패했습니다.");
        };

        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000); // 5초간 녹음
      }).catch(err => {
        document.getElementById("status-message").textContent = "❌ 마이크 접근이 거부되었습니다.";
        console.error(err);
      });
    }
  </script>
  <script>

setInterval(() => {
  fetch("/screen-status")
    .then(r => r.json())
    .then(data => {
      const { screen, display } = data;
      if (screen !== lastScreen || display !== lastDisplay) {
        if (!display) {
          showScreen("start-screen");
        } else {
          showScreen(screen);
        }
        lastScreen = screen;
        lastDisplay = display;
      }
    });
}, 3000); // 3초마다 체크
</script>
</body>
</html>
